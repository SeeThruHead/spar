name: check
on:
  push:
    branches: [main]
    paths-ignore:
      - ".tickets/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - ".tickets/**"
      - "**/*.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: boat
    env:
      MOON_CACHE_TOKEN: ${{ secrets.MOON_CACHE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: https://github.com/oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - name: Install
        run: bun install --frozen-lockfile
      - name: Typecheck, lint, format, tests and the forbidden-code proofs
        run: bun run moon run :check
  browser:
    runs-on: boat
    needs: check
    env:
      MOON_CACHE_TOKEN: ${{ secrets.MOON_CACHE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: https://github.com/oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - name: Install
        run: bun install --frozen-lockfile
      - name: Chromium and Firefox for the browser tests (WebKit runs from the Playwright container)
        run: bun run --cwd apps/demo browser:install
      - name: Drive the demo in a real browser
        run: bun run moon run demo:browser
      - name: Check that mounting and unmounting leaves nothing behind
        run: bun run moon run bench:leaks
      - name: Play every component story at phone, tablet and desktop sizes with an accessibility audit
        run: bun run moon run stories:play
      - name: Run the sidebar app's feature scenarios
        run: bun run moon run sidebar:features
      - name: Check memory at 10,000 rows against Solid
        run: bun run moon run bench:memory
      - name: Walk the sidebar app by keyboard at three sizes with an accessibility audit
        run: bun run moon run sidebar:walkthrough
      - name: The same four suites in Firefox
        run: bun run moon run demo:browser stories:play sidebar:features sidebar:walkthrough --concurrency 1
        env:
          SPAR_BROWSER: firefox
      - name: The same four suites in WebKit
        run: bun run moon run demo:browser stories:play sidebar:features sidebar:walkthrough --concurrency 1
        env:
          SPAR_BROWSER: webkit
  mutation:
    runs-on: boat
    needs: browser
    steps:
      - uses: actions/checkout@v4
      - uses: https://github.com/oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - name: Install
        run: bun install --frozen-lockfile
      - name: Mutation testing of the framework, failing under 90 percent
        run: bun run moon run spar:mutation
