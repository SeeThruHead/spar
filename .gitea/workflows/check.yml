name: check
on:
  push:
    branches: [main]
    paths-ignore:
      - ".tickets/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - ".tickets/**"
      - "**/*.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: boat
    env:
      MOON_CACHE_TOKEN: ${{ secrets.MOON_CACHE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: https://github.com/oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - name: Install
        run: bun install --frozen-lockfile
      - name: Typecheck, lint, format, tests and the forbidden-code proofs
        run: bun run moon run :check
      - name: LLMS.md, the diagnostics page and the docs' code samples match their sources
        run: bun run llms:check && bun run diagnostics:check && bun run samples:check
  browser:
    runs-on: boat
    needs: check
    timeout-minutes: 45
    env:
      MOON_CACHE_TOKEN: ${{ secrets.MOON_CACHE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: https://github.com/oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - name: Install
        run: bun install --frozen-lockfile
      - name: Chromium and Firefox for the browser tests (WebKit runs from the Playwright container)
        run: bun run --cwd apps/demo browser:install
      - name: Drive the demo in a real browser
        run: bun run moon run demo:browser
      - name: Check that mounting and unmounting leaves nothing behind
        run: bun run moon run bench:leaks
      - name: Play every component story at phone, tablet and desktop sizes with an accessibility audit
        run: bun run moon run stories:play
      - name: Run the sidebar app's feature scenarios
        run: bun run moon run sidebar:features
      - name: Check memory at 10,000 rows against Solid
        run: bun run moon run bench:memory
      - name: Walk the sidebar app by keyboard at three sizes with an accessibility audit
        run: bun run moon run sidebar:walkthrough
      - name: Load the devtools through the Vite plugin in the sidebar app, log an action and rewind it
        run: bun run moon run sidebar:devtools
      - name: Run the sidebar app against its backend and follow one trace through both
        run: bun run moon run sidebar:traced
      - name: Walk the site at phone and desktop sizes, in dark and light, and follow a link in a doc page
        run: bun run moon run site:look
      - name: A server-rendered page is taken over without remaking its nodes
        run: bun run moon run ssr:browser
      - name: The same suites in Firefox
        run: bun run moon run demo:browser stories:play sidebar:features sidebar:walkthrough sidebar:devtools sidebar:traced sidebar:deep ssr:browser --concurrency 1
        env:
          SPAR_BROWSER: firefox
      - name: WebKit itself, for a runner with no container runtime
        run: |
          cat /etc/os-release | head -2
          command -v podman docker || echo "no container runtime here"
          bun run --cwd apps/demo browser:install:webkit || echo "WebKit could not be installed natively"
      - name: The same suites in WebKit, sharing one WebKit server
        run: bun packages/browsers/scripts/in.ts bun run moon run demo:browser stories:play sidebar:features sidebar:walkthrough sidebar:devtools sidebar:traced sidebar:deep ssr:browser --concurrency 1
        env:
          SPAR_BROWSER: webkit
  mutation:
    runs-on: boat-pool
    needs: check
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: https://github.com/oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - name: Install
        run: bun install --frozen-lockfile
      - name: Mutation testing of the framework, failing under 90 percent
        run: bun run moon run spar:mutation
