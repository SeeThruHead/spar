name: profile
on:
  workflow_dispatch:
    inputs:
      frameworks:
        description: "Frameworks to profile, comma separated"
        default: "spar,effect-ui,solid"
      probes:
        description: "Probes: select, clear, startup"
        default: "select,clear,startup"

concurrency:
  group: benchmarks
  cancel-in-progress: false

jobs:
  profile:
    runs-on: boat-pool
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: https://github.com/oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - name: Install
        run: bun install --frozen-lockfile
      - name: Chromium
        run: bun run --cwd apps/demo browser:install
      - name: Profile select, clear and startup (printed to this log)
        env:
          PROFILE_FRAMEWORKS: ${{ inputs.frameworks }}
          PROFILE_PROBES: ${{ inputs.probes }}
          PROFILE_RUNS: "9"
          PROFILE_TOP: "30"
        run: |
          echo "machine: $(hostname), $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2), load $(cut -d' ' -f1-3 /proc/loadavg)"
          bun run --cwd apps/bench profile
