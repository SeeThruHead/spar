$schema: https://moonrepo.dev/schemas/workspace.json
versionConstraint: "=2.6.4"
projects:
  - apps/*
  - packages/*
vcs:
  defaultBranch: main
remote:
  host: grpcs://moon-cache.sthloc.vip
  auth:
    token: MOON_CACHE_TOKEN
  cache:
    instanceName: spar
    compression: zstd
    verifyIntegrity: true
