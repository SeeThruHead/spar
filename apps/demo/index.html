<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Spar demo</title>
    <style>
      body {
        font:
          16px/1.5 system-ui,
          sans-serif;
        margin: 2rem auto;
        max-width: 42rem;
        padding: 0 1rem;
        color: #1c2430;
        background: #f7f8fa;
      }
      section,
      article {
        background: #fff;
        border: 1px solid #d5dae2;
        border-radius: 8px;
        padding: 1rem;
        margin: 1rem 0;
      }
      button,
      input {
        font: inherit;
        margin: 0.25rem 0.25rem 0.25rem 0;
        padding: 0.3rem 0.6rem;
      }
      output {
        font-weight: 600;
      }
      [role="alert"] {
        color: #a12020;
      }
      [role="menu"] {
        list-style: none;
        padding: 0.5rem;
        border: 1px solid #d5dae2;
        border-radius: 6px;
        width: fit-content;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
