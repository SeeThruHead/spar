$schema: https://moonrepo.dev/schemas/project.json
fileGroups:
  upstream:
    - /package.json
    - /tsconfig.base.json
    - /packages/lint/oxlintrc.json
    - /packages/lint/house-rules.ts
    - /packages/spar/package.json
    - /packages/spar/src/**/*
tasks:
  typecheck:
    command: bun run typecheck
    inputs: ["**/*", "@group(upstream)"]
  lint:
    command: bun run lint
    inputs: ["**/*", "@group(upstream)"]
  format:
    command: bun run format:check
    inputs: ["**/*", /.oxfmtrc.json]
  build:
    command: bun run build
    inputs: ["src/**/*", "vite.*.config.ts", "@group(upstream)"]
    outputs: ["dist"]
  bench:
    command: bun scripts/bench.ts
    deps: [build]
    options:
      cache: false
  leaks:
    command: bun scripts/leaks.ts
    deps: [build]
    inputs: ["src/**/*", "scripts/leaks.ts", "@group(upstream)"]
  check:
    deps: [typecheck, lint, format]
