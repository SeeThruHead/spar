$schema: https://moonrepo.dev/schemas/project.json
fileGroups:
  upstream:
    - /package.json
    - /tsconfig.base.json
    - /packages/lint/oxlintrc.json
    - /packages/lint/house-rules.ts
    - /packages/spar/src/**/*
    - /packages/ui/src/**/*
tasks:
  typecheck:
    command: bun run typecheck
    inputs: ["**/*", "@group(upstream)"]
  lint:
    command: bun run lint
    inputs: ["**/*", "@group(upstream)"]
  test:
    command: bun run test
    inputs: ["**/*", "@group(upstream)"]
  format:
    command: bun run format:check
    inputs: ["**/*", /.oxfmtrc.json]
  build:
    command: bun run build
    inputs: ["src/**/*", "index.html", "vite.config.ts", "@group(upstream)"]
    outputs: ["dist"]
  features:
    command: bun ../../packages/browsers/scripts/in.ts bun scripts/features.ts
    deps: [build]
    inputs:
      [
        "src/**/*",
        "scripts/**/*",
        "features/**/*",
        "index.html",
        "@group(upstream)",
        "$SPAR_BROWSER",
      ]
  walkthrough:
    command: bun ../../packages/browsers/scripts/in.ts bun scripts/walkthrough.ts
    deps: [build]
    inputs: ["src/**/*", "scripts/**/*", "index.html", "@group(upstream)", "$SPAR_BROWSER"]
  traced:
    command: bun ../../packages/browsers/scripts/in.ts bun scripts/traced.ts
    deps: [build]
    inputs:
      [
        "src/**/*",
        "server/**/*",
        "scripts/traced.ts",
        "scripts/backend.ts",
        "index.html",
        "@group(upstream)",
        "$SPAR_BROWSER",
      ]
    options:
      cache: false
  devtools:
    command: bun ../../packages/browsers/scripts/in.ts bun scripts/devtools.ts
    inputs:
      [
        "src/**/*",
        "scripts/devtools.ts",
        "index.html",
        "vite.config.ts",
        "@group(upstream)",
        "$SPAR_BROWSER",
      ]
    options:
      cache: false
  production:
    command: bun scripts/production.ts
    deps: [build]
    inputs:
      ["src/**/*", "scripts/production.ts", "index.html", "vite.config.ts", "@group(upstream)"]
  check:
    deps: [typecheck, lint, format, test, production]
